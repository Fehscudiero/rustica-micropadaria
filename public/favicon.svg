<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1B3022"/>
  
  <!-- Wheat illustration -->
  <g transform="translate(50, 50)">
    <!-- Stem -->
    <path d="M0 20 Q2 -5 0 -25" stroke="#FAF7F2" stroke-width="2" fill="none"/>
    
    <!-- Grains -->
    <ellipse cx="0" cy="-28" rx="5" ry="8" fill="#FAF7F2"/>
    <ellipse cx="-10" cy="-20" rx="4" ry="6" fill="#FAF7F2" transform="rotate(-15)"/>
    <ellipse cx="10" cy="-20" rx="4" ry="6" fill="#FAF7F2" transform="rotate(15)"/>
    <ellipse cx="-8" cy="-8" rx="4" ry="6" fill="#FAF7F2" transform="rotate(-20)"/>
    <ellipse cx="8" cy="-8" rx="4" ry="6" fill="#FAF7F2" transform="rotate(20)"/>
    <ellipse cx="-5" cy="5" rx="4" ry="5" fill="#FAF7F2" transform="rotate(-10)"/>
    <ellipse cx="5" cy="5" rx="4" ry="5" fill="#FAF7F2" transform="rotate(10)"/>
  </g>
</svg>